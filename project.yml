# Generate the Xcode project with: xcodegen generate
name: IPCalc
options:
  bundleIdPrefix: sk.backbone
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  IPCalcKit:
    path: IPCalcKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing by default. scripts/release.sh signs with a real team and identity; the Spotlight
    # action (App Intents) only runs in builds signed with a Team ID.
    DEVELOPMENT_TEAM: ""
targets:
  IPCalc:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: IPCalcKit
    entitlements:
      path: App/IPCalc.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_NAME: "IP Calc"
        PRODUCT_MODULE_NAME: IPCalc
        PRODUCT_BUNDLE_IDENTIFIER: sk.backbone.ipcalc
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: IP Calc
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 BACKBONE, s.r.o."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
      configs:
        Release:
          # Drops com.apple.security.get-task-allow, which notarization rejects.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
schemes:
  IPCalc:
    build:
      targets:
        IPCalc: all
    run:
      config: Debug
    archive:
      config: Release
